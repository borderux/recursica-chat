# Dependabot version updates: daily, with a 7-day cooldown, one pull request per package system.
# Only GitHub Actions: CircleChat's own Dependabot updates the npm workspaces (server, web, desktop)
# and the egress image, and those updates arrive when CircleChat's main is merged in.
# Security updates skip the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: recursica/main
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
